name: Portable Windows
on:
  workflow_dispatch:
  push:
    tags: ['portable-*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pytest -q
      - run: python -m pip install ziglang==0.13.0
      - run: python scripts/package_portable.py --output entregas/Reapdf-portable-Windows-x64.zip
      - run: python -m scripts.verify_portable_windows entregas/Reapdf-portable-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Reapdf-portable-Windows-x64
          path: |
            entregas/Reapdf-portable-Windows-x64.zip
            entregas/Reapdf-portable-Windows-x64.zip.sha256
