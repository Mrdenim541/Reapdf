name: Windows preview download
'on':
  push:
    tags: ['preview-windows-*']
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PREVIEW_TAG: ${{ github.ref_name }}
      PREVIEW_ARCHIVE: entregas/Reapdf-prueba-20261104-Windows-x64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-lock.txt PySide6==6.8.3 ziglang==0.13.0
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.mjs
      - run: node scripts/check_function_manual.mjs
      - name: Exercise native Qt workflows on Windows
        run: python scripts/check_desktop_candidate.py --output desktop-validation
      - name: Build and exercise the actual packaged executable
        run: |
          python scripts/package_portable.py --output "$env:PREVIEW_ARCHIVE" *> desktop-validation/packaged-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.verify_portable_windows "$env:PREVIEW_ARCHIVE" --report desktop-validation/packaged-report.json *> desktop-validation/packaged-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the requested test version and verify its download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Start-Transcript -Path desktop-validation/packaged-check.log -Append
          if ($env:PREVIEW_TAG -cnotmatch '^preview-windows-[0-9]{8}-[0-9a-f]{7,40}$') { throw 'Invalid preview tag' }
          gh release create "$env:PREVIEW_TAG" "$env:PREVIEW_ARCHIVE" "$env:PREVIEW_ARCHIVE.sha256" "docs/PROBAR_VERSION_ACTUAL.md" --verify-tag --draft --prerelease --title "Reapdf - prueba Windows 2026-11-04" --notes-file docs/PROBAR_VERSION_ACTUAL.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download "$env:PREVIEW_TAG" --pattern 'Reapdf-prueba-20261104-Windows-x64.zip*' --dir entregas/roundtrip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; import hashlib,sys; p=Path(sys.argv[1]); q=Path('entregas/roundtrip')/p.name; digest=lambda x:hashlib.sha256(x.read_bytes()).hexdigest(); assert digest(p)==digest(q); assert digest(q)==q.with_name(q.name+'.sha256').read_text().split()[0]; print('PASS: downloaded release ZIP and checksum match the actual tested package')" "$env:PREVIEW_ARCHIVE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:PREVIEW_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view "$env:PREVIEW_TAG" --json url,isDraft,isPrerelease,assets > desktop-validation/release-meta.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,hashlib,os; from pathlib import Path; p=Path(os.environ['PREVIEW_ARCHIVE']); meta=json.loads(Path('desktop-validation/release-meta.json').read_text(encoding='utf-8-sig')); assert not meta['isDraft'] and meta['isPrerelease']; asset=next(a for a in meta['assets'] if a['name']==p.name); assert asset['size']==p.stat().st_size; q=Path('desktop-validation/packaged-report.json'); r=json.loads(q.read_text()); r['preview_release']={'url':meta['url'],'download_url':asset['url'],'archive_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size_bytes':p.stat().st_size,'download_roundtrip_verified':True}; q.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Stop-Transcript
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-windows-preview-evidence
          path: desktop-validation/
  record:
    needs: preview
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: reapdf-windows-evidence
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: requested-windows-preview-evidence
          path: desktop-validation
      - name: Record source-bound evidence separately
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/publish_windows_report.py --directory desktop-validation
