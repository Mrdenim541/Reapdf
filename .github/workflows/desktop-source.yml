name: Desktop source acceptance checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'recovery/**']
  pull_request:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libasound2t64 libxcb-cursor0
      - run: python -m pip install -r requirements-lock.txt PySide6==6.8.3
      - run: npm ci
      - run: npm run build
      - name: Exercise actual Qt window, save, print, handoff and startup
        run: python scripts/check_desktop_candidate.py --output desktop-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-source-${{ runner.os }}
          path: desktop-validation/
