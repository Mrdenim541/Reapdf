name: Desktop source acceptance checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'recovery/**']
  pull_request:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libasound2t64 libxcb-cursor0
      - run: python -m pip install -r requirements-lock.txt PySide6==6.8.3
      - run: npm ci
      - run: npm run build
      - name: Exercise actual Qt window, save, print, handoff and startup
        run: python scripts/check_desktop_candidate.py --output desktop-validation
      - name: Assemble internal Windows candidate and exercise compiled executable
        if: runner.os == 'Windows' && github.event_name == 'push'
        run: |
          python -m pip install ziglang==0.13.0
          python scripts/package_portable.py --output entregas/Reapdf-internal-validation.zip *> desktop-validation/packaged-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.verify_portable_windows entregas/Reapdf-internal-validation.zip --report desktop-validation/packaged-report.json *> desktop-validation/packaged-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-source-${{ runner.os }}
          path: desktop-validation/

  record-windows-evidence:
    needs: qt
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/recovery/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: reapdf-windows-evidence
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-source-Windows
          path: desktop-validation
      - name: Record source-bound result separately from application code
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/publish_windows_report.py --directory desktop-validation
