name: Reapdf checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils
      - run: python -m pip install -r requirements-lock.txt
      - if: runner.os == 'Linux'
        run: python -c "from backend.standards import standard_status; assert standard_status()['conversion_available']"
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript poppler-utils
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-lock.txt
      - run: .venv/bin/python -c "from backend.standards import standard_status; assert standard_status()['conversion_available']"
      - run: npm ci
      - run: npm run test:ranges
      - run: npm run test:images
      - run: npm run test:bookmarks
      - run: npm run test:catalog
      - run: npm run test:recipes
      - run: npm run test:geometry
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
